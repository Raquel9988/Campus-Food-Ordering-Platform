<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – CampusEats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="register.css" />
</head>

<body>
  <!-- ═══════════════ CARD ═══════════════ -->
  <main class="auth-wrapper">
    <div class="auth-card fade-in">

      <div class="auth-header">
        <div class="auth-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Join CampusEats and order smarter</p>
      </div>

      <form id="signup-form" novalidate>

        <div class="field-group">
          <label class="field-label" for="email">Email address</label>
          <input class="field-input" type="email" id="email" placeholder="you@campus.ac.za" required />
        </div>

        <div class="field-group">
          <label class="field-label" for="role">I am a…</label>
          <div class="select-wrap">
            <select class="field-input field-select" id="role" required>
              <option value="">Select your role</option>
              <option value="student">Student</option>
              <option value="vendor">Vendor</option>
              <option value="admin">Admin</option>
            </select>
            <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none">
              <polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="field-group" id="business-name-group" style="display:none;">
          <label class="field-label" for="business-name">Business name</label>
          <input class="field-input" type="text" id="business-name" placeholder="e.g. Mama's Kitchen" />
        </div>

        <button class="auth-btn" type="submit">
          <span>Send Registration Link</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <polyline points="12 5 19 12 12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <p id="message" class="auth-message"></p>

      </form>

      <p class="auth-switch">
        Already registered?
        <a href="login.html" class="auth-link">Login here</a>
      </p>

    </div>
  </main>

  <script type="module" src="register.js"></script>
</body>

</html>
