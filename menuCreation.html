<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <title>Vendor Menu Management</title>
    </head>

    <body>
        <main class="container">
            <h1>Vendor Menu Management</h1>
            <p class="subtitle">Add And Manage Your Food Items here.</p>

            <section class="form-section">
                <h2>Add Menu Items</h2>
                <form id="menu-item-form">
                    <fieldset class="form-group">
                        <label for="item-name">Item Name</label>
                        <input type="text" id="item-name" name="item-name" placeholder="Enter Item Name" required/>
                    </fieldset>
                    <fieldset class="form-group">
                        <label for="item-description">Description</label>
                        <textarea id="item-description" name="item-description" placeholder="Enter Item Description" required></textarea>
                    </fieldset>
                    <fieldset class="form-group">
                        <label for="item-price">Price(R)</label>
                        <input type="number" id="item-price" name="item-price" placeholder="Enter Price" min="0" step="0.01" required/>
                    </fieldset>
                    <fieldset class="form-group">
                        <label for="item-image">Upload Photo</label>
                        <input type="file" id="item-image" name="item-image" accept="image/*"/>
                    </fieldset>
                    <fieldset class="form-group">
                        <label for="item-availability">Availability</label>
                        <select id="item-availability" name="item-availability">
                            <option value="true">Available</option>
                            <option value="false">Sold Out</option>
                        </select>
                    </fieldset>

                    <button type="submit" id="submit-btn">Add Item</button>
                </form>
            </section>
            <section class="menu-items-section">
                <h2>Your Menu Items</h2>
                <section id="menu-items-container">
                    <p>Your Added Menu Items Will Appear Here.</p>
                </section>
            </section>
        </main>
        <script src="menuCreation.js"></script>
    </body>
</html>
