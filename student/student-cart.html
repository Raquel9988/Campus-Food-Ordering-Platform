<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart</title>
    <link rel="stylesheet" href="student-cart.css" />
  </head>

  <body>
    <!-- Toast Message -->
    <section id="toast" class="toast" aria-live="polite"></section>

    <header>
      <h1>Your Cart 🛒</h1>

      <button class="back-btn" type="button">
        ← Back
      </button>
    </header>

    <main>
      <!-- Cart Items -->
      <section id="cart-items" aria-live="polite">
        <!-- Cart items will be inserted here by student-cart.js -->
      </section>

      <!-- Cart Summary -->
      <section id="cart-summary">
        <h3 id="total">Total: R0.00</h3>

        <button id="place-order" type="button">
          Pay Now
        </button>
      </section>
    </main>

    <script type="module" src="student-cart.js"></script>
  </body>
</html>
