<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Menu</title>
  <link rel="stylesheet" href="student-menu.css" />
</head>

<body>

  <!-- Toast -->
  <section id="toast" class="toast"></section>

  <header>

    <!-- Header text -->
    <section class="header-text">
      <h1 id="vendor-name">Vendor Menu</h1>
      <p>Browse available items and add them to your cart.</p>
    </section>

    <!-- Header actions -->
    <nav class="header-actions">
      <button class="back-btn" id="back-btn">← Back</button>

      <button class="view-cart-btn" id="view-cart" title="Cart">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" width="26" height="26" fill="white">
          <path d="M528.12 301.319l47.273-208C578.19 78.191 567.04 64 551.99 64H128l-9.4-44.27C115.7 8.64 106.8 0 96.27 0H16C7.16 0 0 7.16 0 16v16c0 8.84 7.16 16 16 16h66.5l61.2 288.28c-16.2 9.2-27.7 26.6-27.7 46.72 0 30.93 25.07 56 56 56s56-25.07 56-56c0-9.6-2.4-18.7-6.6-26.7h169.2c-4.2 8-6.6 17.1-6.6 26.7 0 30.93 25.07 56 56 56s56-25.07 56-56c0-23.3-14.2-43.4-34.6-52.3l4.7-20.7z"/>
        </svg>
      </button>
    </nav>

  </header>

  <main>

    <section class="menu-hero">
      <h2>Menu Items</h2>
      <p>Select what you want and add it to your cart.</p>
    </section>

    <section class="menu-section">

      <!-- Menu list -->
      <section id="menu-list">
        <p class="loading-text">Loading menu...</p>
      </section>

    </section>

  </main>

  <script type="module" src="student-menu.js"></script>

</body>
</html>
