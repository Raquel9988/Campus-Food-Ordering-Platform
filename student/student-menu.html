<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Menu – CampusEats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="student-menu.css" />
  </head>

  <body>
    <div id="toast" class="toast" aria-live="polite"></div>

    <header class="header">
      <div class="header-inner">
        <div class="header-brand">
          <a href="../index.html" class="logo-link">
            <img src="../assets/logo.png" alt="CampusEats" class="logo-img" />
          </a>
          <div>
            <h1 id="vendor-name" class="header-title">Vendor Menu</h1>
            <p class="header-sub">Browse items and add them to your cart.</p>
          </div>
        </div>

        <nav class="header-actions" aria-label="Vendor menu actions">
          <button
            type="button"
            class="hdr-btn hdr-btn--ghost"
            id="back-btn"
            aria-label="Go back"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <polyline
                points="15 18 9 12 15 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Back
          </button>

          <button
            type="button"
            class="hdr-btn hdr-btn--cart"
            id="view-cart"
            aria-label="View cart"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 576 512"
              width="18"
              height="18"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M528.12 301.319l47.273-208C578.19 78.191 567.04 64 551.99 64H128l-9.4-44.27C115.7 8.64 106.8 0 96.27 0H16C7.16 0 0 7.16 0 16v16c0 8.84 7.16 16 16 16h66.5l61.2 288.28c-16.2 9.2-27.7 26.6-27.7 46.72 0 30.93 25.07 56 56 56s56-25.07 56-56c0-9.6-2.4-18.7-6.6-26.7h169.2c-4.2 8-6.6 17.1-6.6 26.7 0 30.93 25.07 56 56 56s56-25.07 56-56c0-23.3-14.2-43.4-34.6-52.3l4.7-20.7z"
              />
            </svg>
            Cart
          </button>
        </nav>
      </div>
    </header>

    <main class="main-card">
      <div class="menu-hero">
        <h2 class="section-heading">Menu Items</h2>
        <p class="section-sub">Select what you want and add it to your cart.</p>
      </div>

      <!-- ═══════════ DIETARY FILTER BAR (Person 6) ═══════════ -->
      <div class="filter-bar" id="filter-bar" aria-label="Dietary filters">
        <span class="filter-label">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <polygon
              points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Filter:
        </span>

        <div
          class="filter-chips"
          role="group"
          aria-label="Select dietary filters"
        >
          <button
            type="button"
            class="filter-chip active"
            data-filter="all"
            aria-pressed="true"
          >
            All
          </button>
          <button
            type="button"
            class="filter-chip"
            data-filter="halal"
            aria-pressed="false"
          >
            🥩 Halal
          </button>
          <button
            type="button"
            class="filter-chip"
            data-filter="vegetarian"
            aria-pressed="false"
          >
            🥗 Vegetarian
          </button>
          <button
            type="button"
            class="filter-chip"
            data-filter="vegan"
            aria-pressed="false"
          >
            🌱 Vegan
          </button>
          <button
            type="button"
            class="filter-chip"
            data-filter="nut_free"
            aria-pressed="false"
          >
            🥜 Nut-Free
          </button>
          <button
            type="button"
            class="filter-chip"
            data-filter="gluten_free"
            aria-pressed="false"
          >
            🌾 Gluten-Free
          </button>
          <button
            type="button"
            class="filter-chip"
            data-filter="dairy_free"
            aria-pressed="false"
          >
            🥛 Dairy-Free
          </button>
        </div>

        <!-- Active filter summary + clear -->
        <div
          class="filter-summary"
          id="filter-summary"
          aria-live="polite"
        ></div>
      </div>

      <!-- Menu grid -->
      <div
        id="menu-list"
        class="menu-grid"
        aria-live="polite"
        aria-label="Menu items"
      >
        <p class="loading-text">
          <span class="spinner-sm"></span>
          Loading menu…
        </p>
      </div>
    </main>

    <script type="module" src="student-menu.js"></script>
  </body>
</html>
