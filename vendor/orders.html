<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Orders Dashboard – CampusEats</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="orders.css" />
</head>

<body>
  <header class="header">
    <section class="header-content">
      <section class="header-brand">
        <a href="../index.html" class="logo-link">
          <img src="../assets/logo.png" alt="CampusEats" class="logo-img" />
        </a>

        <h1 class="header-title">Orders Dashboard</h1>
      </section>

      <nav class="header-actions" aria-label="Vendor orders actions">
        <button
          id="dashboard-btn"
          class="hdr-btn hdr-btn--ghost"
          type="button"
          title="Manage menu"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          </svg>

          <span>Manage Menu</span>
        </button>

        <button
          id="refresh-btn"
          class="hdr-btn hdr-btn--refresh"
          type="button"
          title="Refresh orders"
        >
          <svg id="refresh-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <polyline points="23 4 23 10 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <span>Refresh</span>
        </button>
      </nav>
    </section>
  </header>

  <main class="container">
    <section id="loading-container" class="loading-container hidden">
      <section class="spinner" aria-hidden="true"></section>
      <p>Loading orders…</p>
    </section>

    <section id="error-container" class="error-container hidden">
      <section class="error-message">
        <p id="error-text"></p>

        <button id="retry-btn" class="retry-btn" type="button" title="Retry">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <polyline points="1 4 1 10 7 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          Try Again
        </button>
      </section>
    </section>

    <section id="empty-state" class="empty-state hidden">
      <svg
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        class="empty-state-icon"
        aria-hidden="true"
      >
        <path
          d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2" />
      </svg>

      <p>No paid active orders are available right now.</p>
    </section>

    <section id="orders-container" class="orders-grid" aria-live="polite">
      <!-- Orders will be inserted here by orders.js -->
    </section>
  </main>

  <section
    id="vendor-modal-backdrop"
    class="vendor-modal-backdrop hidden"
    aria-hidden="true"
  >
    <section
      class="vendor-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="vendor-modal-title"
      aria-describedby="vendor-modal-message"
    >
      <section id="vendor-modal-icon" class="vendor-modal-icon vendor-modal-icon--success" aria-hidden="true">
        ✓
      </section>

      <section class="vendor-modal-body">
        <p class="vendor-modal-label">CampusEats Vendor Update</p>
        <h2 id="vendor-modal-title">Order update complete</h2>
        <p id="vendor-modal-message"></p>
      </section>

      <section class="vendor-modal-actions">
        <button id="vendor-modal-ok-btn" class="vendor-modal-ok-btn" type="button">
          OK
        </button>
      </section>
    </section>
  </section>

  <script type="module" src="orders.js"></script>
</body>
</html>
