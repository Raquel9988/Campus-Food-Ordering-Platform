<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Dashboard</title>

    <link rel="stylesheet" href="vendor-dashboard.css">
</head>

<body>

    <header>
        <h1>Vendor Dashboard</h1>
        <div>
            <p id="user-info"></p>
            <button id="logout">Logout</button>
            <button id="orders-dashboard">Orders</button>
        </div>
    </header>

    <main>

        <h2>Menu Management</h2>
        <p>Add and manage your food items here.</p>

        <section class="form-section">
            <h2>Add Menu Items</h2>

            <form id="menu-item-form">

                <fieldset class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" placeholder="Enter Item Name" required />
                </fieldset>

                <fieldset class="form-group">
                    <label for="item-description">Description</label>
                    <textarea id="item-description" placeholder="Enter Item Description" required></textarea>
                </fieldset>

                <fieldset class="form-group">
                    <label for="item-price">Price (R)</label>
                    <input type="number" id="item-price" min="0" step="0.01" placeholder="Enter Price" required />
                </fieldset>

                <fieldset class="form-group">
                    <label for="item-image">Upload Photo</label>
                    <input type="file" id="item-image" accept="image/*" />
                </fieldset>

                <fieldset class="form-group">
                    <label for="item-availability">Availability</label>
                    <select id="item-availability">
                        <option value="true">Available</option>
                        <option value="false">Sold Out</option>
                    </select>
                </fieldset>

                <button type="submit" id="submit-btn">Add Item</button>
                <button type="button" id="cancel-edit-btn" style="display:none;">Cancel</button>

            </form>
        </section>

        <section class="menu-items-section">
            <h2>Your Menu Items</h2>

            <section id="menu-items-container">
                <p>Create, update, and manage your menu items in one place.</p>
            </section>
        </section>

    </main>

    <script type="module" src="vendor-dashboard.js"></script>
    <script type="module" src="menuCreation.js"></script>

</body>

</html>
