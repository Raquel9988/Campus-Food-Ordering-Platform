<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Dashboard – CampusEats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="vendor-dashboard.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="../index.html" class="logo-link">
          <img src="../assets/logo.png" alt="CampusEats" class="logo-img" />
        </a>
        <div>
          <h1 class="header-title">Vendor Dashboard</h1>
          <p id="user-info" class="header-sub"></p>
        </div>
      </div>
      <div class="header-actions">
        <button id="orders-dashboard" class="hdr-btn hdr-btn--ghost" title="View orders">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="9" y1="16" x2="13" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Orders</span>
        </button>
        <button id="logout" class="hdr-btn hdr-btn--danger" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN GRID -->
  <main class="main-grid">

    <!-- Form card -->
    <section class="card form-section">
      <div class="card-header">
        <div class="card-icon card-icon--green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="8" x2="12" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h2 class="card-title" id="form-card-title">Add Menu Item</h2>
          <p class="card-sub">Fill in the details below</p>
        </div>
      </div>

      <p id="form-message" class="form-message"></p>

      <form id="menu-item-form" novalidate>

        <div class="field-group">
          <label class="field-label" for="item-name">Item name</label>
          <input class="field-input" type="text" id="item-name" placeholder="e.g. Cheese Burger" />
        </div>

        <div class="field-group">
          <label class="field-label" for="item-description">Description</label>
          <textarea class="field-input" id="item-description" placeholder="What makes it great?"></textarea>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label class="field-label" for="item-price">Price (R)</label>
            <input class="field-input" type="number" id="item-price" min="0.01" step="0.01" placeholder="0.00" />
          </div>
          <div class="field-group">
            <label class="field-label" for="item-availability">Availability</label>
            <div class="select-wrap">
              <select class="field-input field-select" id="item-availability">
                <option value="true">Available</option>
                <option value="false">Sold Out</option>
              </select>
              <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none">
                <polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Photo</label>
          <label class="file-drop" for="item-image">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Click to upload image</span>
            <input type="file" id="item-image" accept="image/*" style="display:none;" />
          </label>
        </div>

        <!-- Dietary Tags -->
        <div class="field-group">
          <label class="field-label">Dietary Tags</label>
          <p class="field-sub">Select at least one tag that applies.</p>

          <!-- Hidden validity anchor (native fallback) -->
          <input type="text" id="dietary-anchor" style="display:none;" tabindex="-1" aria-hidden="true" />

          <div class="dietary-grid">
            <label class="dietary-chip">
              <input type="checkbox" class="dietary-tag" value="halal" /><span>Halal</span>
            </label>
            <label class="dietary-chip">
              <input type="checkbox" class="dietary-tag" value="vegetarian" /><span>Vegetarian</span>
            </label>
            <label class="dietary-chip">
              <input type="checkbox" class="dietary-tag" value="vegan" /><span>Vegan</span>
            </label>
            <label class="dietary-chip">
              <input type="checkbox" class="dietary-tag" value="nut_free" /><span>Nut-Free</span>
            </label>
            <label class="dietary-chip">
              <input type="checkbox" class="dietary-tag" value="gluten_free" /><span>Gluten-Free</span>
            </label>
            <label class="dietary-chip">
              <input type="checkbox" class="dietary-tag" value="dairy_free" /><span>Dairy-Free</span>
            </label>
            <label class="dietary-chip dietary-chip--other">
              <input type="checkbox" id="other-checkbox" /><span>Other…</span>
            </label>
          </div>

          <div id="other-input-wrap" style="display:none; margin-top:10px;">
            <input
              class="field-input"
              type="text"
              id="other-input"
              placeholder="e.g. kosher, low-sugar (comma separated)"
            />
          </div>

          <p id="dietary-error" class="field-hint-error" style="display:none;"></p>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="action-btn action-btn--primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <line x1="12" y1="8" x2="12" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Add Item
          </button>
          <button type="button" id="cancel-edit-btn" class="action-btn action-btn--ghost" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Cancel
          </button>
        </div>

      </form>
    </section>

    <!-- Menu Items List -->
    <section class="card menu-items-section">
      <div class="card-header">
        <div class="card-icon card-icon--orange">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M3 3h18v4H3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M3 11h18v4H3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M3 19h18v2H3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h2 class="card-title">Your Menu</h2>
          <p class="card-sub">Manage, edit and remove your items</p>
        </div>
      </div>

      <div id="menu-items-container">
        <p class="empty-hint">
          <span class="spinner-sm"></span>
          Loading your menu…
        </p>
      </div>
    </section>

  </main>

  <script type="module" src="vendor-dashboard.js"></script>
  <script type="module" src="menuCreation.js"></script>
</body>
</html>
